<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <!-- Logo Gradient (Cyan to Purple to Green) -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <!-- Neon Glow Effect -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="12"/>
  
  <!-- Glowing Hexagon Outer Node -->
  <polygon points="400,100 640,240 640,520 400,660 160,520 160,240" fill="none" stroke="url(#bGrad)" stroke-width="14" filter="url(#neonGlow)" opacity="0.85"/>
  
  <!-- Glowing "B" Symbol -->
  <path filter="url(#neonGlow)" fill="url(#bGrad)" d="M260 210 H420 C490 210 535 245 535 305 C535 348 502 380 455 390 C510 405 548 442 548 498 C548 575 480 595 400 595 H260 V210 Z M345 285 V360 H405 C435 360 458 344 458 322 C458 300 435 285 405 285 H345 Z M345 435 V520 H415 C450 520 472 502 472 475 C472 448 450 435 415 435 H345 Z"/>
  
  <!-- Wordmark Text: Buildlyst -->
  <text x="400" y="730" font-family="'Space Grotesk', 'DM Sans', sans-serif" font-size="64" font-weight="bold" fill="#ffffff" letter-spacing="4" text-anchor="middle">Buildlyst</text>
</svg>
