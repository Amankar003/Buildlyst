<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="100%" stop-color="#010103"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9D50BB"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="rgba(0, 210, 255, 0.5)" stroke-width="10"/>
  <!-- Circuit Nodes -->
  <circle cx="100" cy="100" r="16" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="412" cy="100" r="16" fill="#9D50BB" filter="url(#glow)"/>
  <circle cx="100" cy="412" r="16" fill="#00D2FF" filter="url(#glow)"/>
  <circle cx="412" cy="412" r="16" fill="#27C93F" filter="url(#glow)"/>
  <line x1="100" y1="100" x2="200" y2="200" stroke="#00D2FF" stroke-width="6" opacity="0.6"/>
  <line x1="412" y1="100" x2="312" y2="200" stroke="#9D50BB" stroke-width="6" opacity="0.6"/>
  <!-- Glowing Central B Core -->
  <path filter="url(#glow)" fill="url(#circuitGrad)" d="M160 120 H270 C330 120 365 145 365 190 C365 220 342 242 310 250 C350 260 375 288 375 330 C375 385 330 400 270 400 H160 V120 Z M220 175 V230 H260 C282 230 298 220 298 202 C298 185 282 175 260 175 H220 Z M220 280 V345 H268 C292 345 310 332 310 312 C310 292 292 280 268 280 H220 Z"/>
</svg>
