<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 1: Sticky Note Chaos</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 600px; height: 400px; position: relative; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 2rem; overflow: hidden; }
        .note { position: absolute; width: 60px; height: 60px; background: #ffeaa7; color: black; padding: 10px; font-size: 10px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; justify-content: center; text-align: center; font-weight: bold; }
        .note.automated { background: rgba(0, 210, 255, 0.1); color: #00d2ff; border: 1px solid #00d2ff; box-shadow: 0 0 15px rgba(0,210,255,0.4); transform: none !important; border-radius: 8px; }
        button { background: #00d2ff; color: black; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: white; }
        .back { position: absolute; top: 20px; left: 20px; color: #aaa; text-decoration: none; }
        .back:hover { color: white; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <h2>Concept 1: The Sticky Note Chaos</h2>
    <div class="container" id="board"></div>
    <button id="activate-btn">Activate Buildlyst</button>

    <script>
        const board = document.getElementById('board');
        const btn = document.getElementById('activate-btn');
        let isAutomated = false;
        const notes = [];

        // Generate 20 messy notes
        for (let i = 0; i < 20; i++) {
            const note = document.createElement('div');
            note.className = 'note';
            note.innerText = 'Manual Task ' + (i+1);
            // Random messy positions
            const x = Math.random() * 500;
            const y = Math.random() * 300;
            const rot = (Math.random() - 0.5) * 60;
            note.style.left = x + 'px';
            note.style.top = y + 'px';
            note.style.transform = `rotate(${rot}deg)`;
            board.appendChild(note);
            notes.push(note);
        }

        btn.addEventListener('click', () => {
            if (!isAutomated) {
                // Snap to grid
                let row = 0, col = 0;
                notes.forEach((note, i) => {
                    note.classList.add('automated');
                    note.innerText = 'PROCESSED';
                    // Grid math: 5 cols, 4 rows
                    col = i % 5;
                    row = Math.floor(i / 5);
                    note.style.left = (40 + col * 100) + 'px';
                    note.style.top = (30 + row * 80) + 'px';
                });
                btn.innerText = 'Reset Chaos';
                btn.style.background = '#8a2387';
                btn.style.color = 'white';
            } else {
                // Return to chaos
                notes.forEach((note, i) => {
                    note.classList.remove('automated');
                    note.innerText = 'Manual Task ' + (i+1);
                    const x = Math.random() * 500;
                    const y = Math.random() * 300;
                    const rot = (Math.random() - 0.5) * 60;
                    note.style.left = x + 'px';
                    note.style.top = y + 'px';
                    note.style.transform = `rotate(${rot}deg)`;
                });
                btn.innerText = 'Activate Buildlyst';
                btn.style.background = '#00d2ff';
                btn.style.color = 'black';
            }
            isAutomated = !isAutomated;
        });
    </script>
</body>
</html>
