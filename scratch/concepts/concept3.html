<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept 3: Terminal Override</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 600px; height: 350px; position: relative; background: #000; border: 1px solid #333; border-radius: 12px; margin-bottom: 2rem; overflow: hidden; padding: 20px; box-sizing: border-box; }
        
        .terminal-text { font-family: monospace; color: #0f0; font-size: 14px; white-space: pre-wrap; opacity: 1; transition: opacity 0.3s; }
        .cursor { display: inline-block; width: 8px; height: 15px; background: #0f0; animation: blink 1s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .matrix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; opacity: 0; pointer-events: none; transition: opacity 0.5s; background: rgba(0,210,255,0.05); }
        .matrix-column { flex: 1; color: #00d2ff; font-family: monospace; font-size: 12px; font-weight: bold; writing-mode: vertical-rl; text-orientation: upright; animation: fall linear infinite; }
        
        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .container.automated .terminal-text { opacity: 0; }
        .container.automated .matrix { opacity: 1; }
        .container.automated { border-color: #00d2ff; box-shadow: 0 0 30px rgba(0,210,255,0.2); }

        button { background: #00d2ff; color: black; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: white; }
        .back { position: absolute; top: 20px; left: 20px; color: #aaa; text-decoration: none; }
        .back:hover { color: white; }
    </style>
</head>
<body>
    <a href="index.html" class="back">← Back to Menu</a>
    <h2>Concept 3: Terminal Override</h2>
    <div class="container" id="board">
        <div class="terminal-text" id="typewriter">C:\Users\Manual&gt; processing_data.exe<br>Loading...<br>Error: Data overflow.<br>Retrying row 1432...<br><span class="cursor"></span></div>
        <div class="matrix" id="matrix-bg">
            <!-- columns injected via js -->
        </div>
    </div>
    <button id="activate-btn">Activate Buildlyst</button>

    <script>
        const board = document.getElementById('board');
        const btn = document.getElementById('activate-btn');
        const matrixBg = document.getElementById('matrix-bg');
        let isAutomated = false;

        // Generate matrix columns
        for(let i=0; i<30; i++) {
            const col = document.createElement('div');
            col.className = 'matrix-column';
            col.style.animationDuration = (Math.random() * 2 + 1) + 's';
            col.style.opacity = Math.random();
            col.innerText = '1010101100101010110101';
            if(Math.random() > 0.5) col.style.color = '#8a2387';
            matrixBg.appendChild(col);
        }

        btn.addEventListener('click', () => {
            if (!isAutomated) {
                board.classList.add('automated');
                btn.innerText = 'Reset Terminal';
                btn.style.background = '#8a2387';
                btn.style.color = 'white';
            } else {
                board.classList.remove('automated');
                btn.innerText = 'Activate Buildlyst';
                btn.style.background = '#00d2ff';
                btn.style.color = 'black';
            }
            isAutomated = !isAutomated;
        });
    </script>
</body>
</html>
