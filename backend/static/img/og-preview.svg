<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="300" fill="#00D2FF" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="300" fill="#8A2387" opacity="0.08" filter="url(#glow)"/>
  <text x="100" y="240" fill="url(#textGrad)" font-family="sans-serif" font-size="76" font-weight="bold">Buildlyst</text>
  <text x="100" y="330" fill="#ffffff" font-family="sans-serif" font-size="44" font-weight="600">Premium AI &amp; Data Engineering Studio</text>
  <text x="100" y="410" fill="#a0a0b0" font-family="sans-serif" font-size="24">Transforming Business Challenges into Automated Profit Systems</text>
  <rect x="100" y="470" width="280" height="60" rx="30" fill="url(#textGrad)"/>
  <text x="150" y="508" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">Explore Buildlyst →</text>
</svg>
