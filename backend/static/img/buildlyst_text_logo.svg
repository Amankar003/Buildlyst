<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Header Gradient (White to Light Grey Gradient) -->
    <linearGradient id="headerTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A5"/>
    </linearGradient>

    <!-- Cyan-Purple Neon Gradient (High Shine Accent) -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#8A2387"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    .header-logo-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 140px;
      letter-spacing: -2px;
    }
  </style>

  <!-- Clean Header Wordmark Text Logo -->
  <text x="50" y="190" class="header-logo-text" fill="url(#headerTextGrad)">Buildlyst</text>
  
  <!-- Subtle Glowing Cyan Dot Accent -->
  <circle cx="810" cy="175" r="14" fill="#00D2FF" filter="url(#softGlow)"/>
</svg>
