<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="10"/>
  <!-- Developer <B/> Tag -->
  <text x="256" y="320" font-family="'Space Grotesk', sans-serif" font-size="210" font-weight="bold" fill="url(#codeGrad)" filter="url(#glow)" text-anchor="middle">&lt;B/&gt;</text>
</svg>
