<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Header Text Gradient (White to Light Grey) -->
    <linearGradient id="headerTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A5"/>
    </linearGradient>

    <!-- Glowing Cyan/Purple Tech Gradient -->
    <linearGradient id="techGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    .favicon-header-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 340px;
    }
  </style>

  <!-- Dark Luxury Frame -->
  <rect width="512" height="512" rx="140" fill="#080812" stroke="rgba(0, 210, 255, 0.4)" stroke-width="12"/>

  <!-- Exact Header Monogram B -->
  <text x="240" y="375" class="favicon-header-text" fill="url(#headerTextGrad)" filter="url(#softGlow)" text-anchor="middle">B</text>

  <!-- Glowing AI Robot Head Tech Emblem (Top Right) -->
  <g transform="translate(350, 70) scale(0.9)" filter="url(#softGlow)">
    <!-- Robot Antenna -->
    <line x1="60" y1="12" x2="60" y2="28" stroke="#00D2FF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="7" fill="#00D2FF"/>
    
    <!-- Robot Head Outline -->
    <rect x="20" y="28" width="80" height="64" rx="16" fill="url(#techGlowGrad)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Glowing Visor / AI Eyes -->
    <rect x="30" y="42" width="60" height="22" rx="10" fill="#040409"/>
    <circle cx="45" cy="53" r="6" fill="#00D2FF"/>
    <circle cx="75" cy="53" r="6" fill="#00D2FF"/>

    <!-- Ear Sensors -->
    <rect x="12" y="44" width="8" height="32" rx="3" fill="#00D2FF"/>
    <rect x="100" y="44" width="8" height="32" rx="3" fill="#00D2FF"/>
  </g>
</svg>
