<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Header Text Gradient (White to Light Grey Gradient) -->
    <linearGradient id="headerTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A5"/>
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    .favicon-header-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 340px;
    }
  </style>

  <!-- Dark Luxury Background Frame -->
  <rect width="512" height="512" rx="140" fill="#080812" stroke="rgba(0, 210, 255, 0.4)" stroke-width="12"/>

  <!-- Exact Header Monogram B in Space Grotesk Gradient -->
  <text x="256" y="375" class="favicon-header-text" fill="url(#headerTextGrad)" filter="url(#softGlow)" text-anchor="middle">B</text>

  <!-- Glowing Cyan Dot Accent (Top Right) -->
  <circle cx="390" cy="130" r="28" fill="url(#cyanGlowGrad)" filter="url(#softGlow)"/>
</svg>
