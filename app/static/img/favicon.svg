<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060c"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#8A2387"/>
      <stop offset="100%" stop-color="#27C93F"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="rgba(0, 210, 255, 0.4)" stroke-width="10"/>
  <!-- Glowing Hexagon Frame -->
  <polygon points="256,40 430,140 430,340 256,440 82,340 82,140" fill="none" stroke="url(#glowGrad)" stroke-width="12" filter="url(#neon)" opacity="0.8"/>
  <!-- Glowing B Logo -->
  <path filter="url(#neon)" fill="url(#glowGrad)" d="M165 130 H275 C330 130 365 155 365 200 C365 232 342 255 310 262 C350 273 378 300 378 340 C378 395 330 410 275 410 H165 V130 Z M230 185 V240 H268 C290 240 306 228 306 212 C306 196 290 185 268 185 H230 Z M230 290 V355 H275 C300 355 318 342 318 322 C318 302 300 290 275 290 H230 Z"/>
</svg>
