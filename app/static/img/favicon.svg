<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp White Text Gradient -->
    <linearGradient id="bwTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </linearGradient>

    <!-- Pristine White Glow Filter -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
    .favicon-bw-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 340px;
    }
  </style>

  <!-- Deep Obsidian Black Background Frame with White Border -->
  <rect width="512" height="512" rx="140" fill="#000000" stroke="rgba(255, 255, 255, 0.4)" stroke-width="12"/>

  <!-- Pure White Space Grotesk Header Monogram B -->
  <text x="256" y="375" class="favicon-bw-text" fill="url(#bwTextGrad)" filter="url(#whiteGlow)" text-anchor="middle">B</text>
</svg>
