<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study Prototypes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'accent-cyan': '#00d2ff',
                        'accent-purple': '#8a2387',
                        'bg-dark': 'rgba(10, 12, 16, 0.95)',
                        'card-bg': 'rgba(16, 20, 26, 0.95)',
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .glowing-border {
            border: 1.5px solid rgba(0, 210, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .glowing-border:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3), inset 0 0 20px rgba(138, 35, 135, 0.2);
            border-color: rgba(0, 210, 255, 0.6);
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const dummyCase = {
            title: "WhatsApp AI Property Qualification & Booking Agent",
            subDomain: "Luxury Residential & Commercial Real Estate",
            location: "Bhopal & Delhi NCR",
            timeToRoi: "60 Days ROI",
            bigStat: "+65%",
            bigStatLabel: "Qualified Buyer Bookings",
            impact: "Increased qualified buyer bookings by +65%, automated 100% of tier-1 site visit scheduling, and completely halted lead leakage.",
            deliverables: ["24/7 WhatsApp AI Bot", "CRM Auto-Sync", "Calendar Booking Engine"],
            tags: ["WhatsApp AI Agent", "FastAPI", "Python", "CRM Sync"],
            imageSrc: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            problem: "Real estate brokers were losing 40% of high-intent property buyers over weekends due to delayed manual responses and unorganized CRM logs.",
            solution: "Engineered a 24/7 Conversational WhatsApp AI Agent connected directly to client CRM & Google Calendar to pre-qualify budget & book visits automatically."
        };

        function ModalPrototype() {
            const [isModalOpen, setIsModalOpen] = useState(false);

            return (
                <div className="max-w-md mx-auto">
                    <p className="text-gray-400 mb-6 text-sm text-center">Design 1: Simplified card with a modal for deep technical details.</p>
                    
                    {/* Simplified Card */}
                    <div className="bg-card-bg rounded-[22px] overflow-hidden glowing-border flex flex-col h-[400px]">
                        <div className="relative h-[200px] border-b border-white/10">
                            <img src={dummyCase.imageSrc} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-bg-dark to-transparent"></div>
                            <div className="absolute bottom-3 left-4 text-[11px] font-bold text-white bg-accent-cyan/20 border border-accent-cyan/40 px-3 py-1 rounded-full backdrop-blur-md">
                                📍 {dummyCase.location}
                            </div>
                        </div>
                        
                        <div className="p-6 flex flex-col gap-3 flex-grow">
                            <div>
                                <span className="text-[11px] font-extrabold text-accent-purple uppercase tracking-wide">{dummyCase.subDomain}</span>
                                <h4 className="text-xl font-bold text-white leading-tight mt-1">{dummyCase.title}</h4>
                            </div>
                            
                            <p className="text-[13px] text-gray-400 leading-relaxed line-clamp-3">
                                <strong className="text-accent-cyan">Business Impact:</strong> {dummyCase.impact}
                            </p>
                            
                            <div className="mt-auto flex justify-between items-center pt-3 border-t border-white/10">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl font-extrabold text-accent-cyan drop-shadow-[0_0_15px_rgba(0,210,255,0.3)]">{dummyCase.bigStat}</span>
                                </div>
                                <button 
                                    onClick={() => setIsModalOpen(true)}
                                    className="px-4 py-2 rounded-full bg-white/5 border border-white/20 text-white text-xs font-bold hover:bg-white/10 transition"
                                >
                                    Read Full Case Study →
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-card-bg border border-accent-cyan/30 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-[0_0_50px_rgba(0,210,255,0.15)] relative">
                                <button onClick={() => setIsModalOpen(false)} className="absolute top-4 right-4 text-white hover:text-accent-cyan text-xl">✕</button>
                                
                                <img src={dummyCase.imageSrc} className="w-full h-48 object-cover rounded-t-2xl opacity-70" />
                                
                                <div className="p-8">
                                    <span className="text-xs font-extrabold text-accent-purple uppercase">{dummyCase.subDomain}</span>
                                    <h2 className="text-2xl font-bold text-white mb-6">{dummyCase.title}</h2>
                                    
                                    <div className="grid grid-cols-2 gap-8 mb-8">
                                        <div>
                                            <h3 className="text-accent-cyan font-bold text-sm mb-2">The Problem</h3>
                                            <p className="text-gray-400 text-sm">{dummyCase.problem}</p>
                                        </div>
                                        <div>
                                            <h3 className="text-accent-cyan font-bold text-sm mb-2">Our Solution</h3>
                                            <p className="text-gray-400 text-sm">{dummyCase.solution}</p>
                                        </div>
                                    </div>

                                    <div className="border-t border-white/10 pt-6">
                                        <h3 className="text-white font-bold text-sm mb-4">Tech Stack & Deliverables</h3>
                                        <div className="flex flex-wrap gap-2 mb-4">
                                            {dummyCase.tags.map(t => <span className="text-[10px] px-2 py-1 bg-accent-cyan/10 text-accent-cyan border border-accent-cyan/20 rounded-md font-bold">{t}</span>)}
                                        </div>
                                        <ul className="grid grid-cols-2 gap-2">
                                            {dummyCase.deliverables.map(d => <li className="text-sm text-gray-300 flex items-center gap-2"><span className="text-accent-cyan">✓</span> {d}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function HoverPrototype() {
            return (
                <div className="max-w-md mx-auto group">
                    <p className="text-gray-400 mb-6 text-sm text-center">Design 2: Hover over the image to reveal tech specs.</p>
                    
                    <div className="bg-card-bg rounded-[22px] overflow-hidden glowing-border flex flex-col h-[400px]">
                        <div className="relative h-[200px] border-b border-white/10 overflow-hidden">
                            <img src={dummyCase.imageSrc} className="w-full h-full object-cover transition duration-500 group-hover:scale-110 group-hover:blur-sm opacity-100 group-hover:opacity-30" />
                            <div className="absolute inset-0 bg-gradient-to-t from-bg-dark to-transparent"></div>
                            
                            <div className="absolute bottom-3 left-4 text-[11px] font-bold text-white bg-accent-cyan/20 border border-accent-cyan/40 px-3 py-1 rounded-full backdrop-blur-md transition-opacity duration-300 group-hover:opacity-0">
                                📍 {dummyCase.location}
                            </div>

                            {/* Hover Reveal Content */}
                            <div className="absolute inset-0 p-5 flex flex-col justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40">
                                <span className="text-[10px] font-extrabold text-accent-cyan uppercase tracking-wider mb-2">Tech Stack & Deliverables</span>
                                <div className="flex flex-col gap-1.5 mb-3">
                                    {dummyCase.deliverables.map(d => <div className="text-[11px] text-white font-semibold flex items-center gap-2"><span className="text-accent-cyan">✓</span> {d}</div>)}
                                </div>
                                <div className="flex flex-wrap gap-1 mt-auto">
                                    {dummyCase.tags.map(t => <span className="text-[9px] px-1.5 py-0.5 bg-accent-cyan/20 text-accent-cyan rounded font-bold border border-accent-cyan/30">{t}</span>)}
                                </div>
                            </div>
                        </div>
                        
                        <div className="p-6 flex flex-col gap-3 flex-grow">
                            <div>
                                <span className="text-[11px] font-extrabold text-accent-purple uppercase tracking-wide">{dummyCase.subDomain}</span>
                                <h4 className="text-xl font-bold text-white leading-tight mt-1">{dummyCase.title}</h4>
                            </div>
                            <p className="text-[13px] text-gray-400 leading-relaxed line-clamp-2">
                                <strong className="text-accent-cyan">Business Impact:</strong> {dummyCase.impact}
                            </p>
                            <div className="mt-auto flex justify-between items-center pt-3 border-t border-white/10">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl font-extrabold text-accent-cyan drop-shadow-[0_0_15px_rgba(0,210,255,0.3)]">{dummyCase.bigStat}</span>
                                    <span className="text-[10px] font-bold text-gray-400 max-w-[80px] uppercase leading-tight">{dummyCase.bigStatLabel}</span>
                                </div>
                                <div className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-accent-cyan/10 to-accent-purple/10 border border-accent-purple/30 text-white text-[11px] font-bold">
                                    ⏱️ {dummyCase.timeToRoi}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StackedPrototype() {
            return (
                <div className="max-w-md mx-auto">
                    <p className="text-gray-400 mb-6 text-sm text-center">Design 3: Stacked layout (Image takes full width at top, text flows naturally below).</p>
                    
                    <div className="bg-card-bg rounded-[22px] overflow-hidden glowing-border flex flex-col">
                        {/* Full width image top */}
                        <div className="relative h-[200px] border-b border-white/10">
                            <img src={dummyCase.imageSrc} className="w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-bg-dark to-transparent"></div>
                            <div className="absolute bottom-3 left-4 text-[11px] font-bold text-white bg-accent-cyan/20 border border-accent-cyan/40 px-3 py-1 rounded-full backdrop-blur-md">
                                📍 {dummyCase.location}
                            </div>
                        </div>
                        
                        <div className="p-6 flex flex-col gap-4">
                            <div>
                                <span className="text-[11px] font-extrabold text-accent-purple uppercase tracking-wide">{dummyCase.subDomain}</span>
                                <h4 className="text-xl font-bold text-white leading-tight mt-1">{dummyCase.title}</h4>
                            </div>
                            
                            <p className="text-[13px] text-gray-400 leading-relaxed">
                                <strong className="text-accent-cyan">Business Impact:</strong> {dummyCase.impact}
                            </p>

                            {/* Tech Stack below text instead of squashed next to image */}
                            <div className="bg-white/5 rounded-xl p-4 border border-white/10">
                                <span className="text-[10px] font-extrabold text-accent-cyan uppercase tracking-widest mb-2 block">Tech & Scope</span>
                                <div className="grid grid-cols-2 gap-2 mb-3">
                                    {dummyCase.deliverables.map(d => <div className="text-[11px] text-gray-300 font-semibold flex items-start gap-1.5"><span className="text-accent-cyan mt-0.5">✓</span> <span className="leading-tight">{d}</span></div>)}
                                </div>
                                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/10">
                                    {dummyCase.tags.map(t => <span className="text-[9px] px-2 py-1 bg-accent-cyan/10 text-accent-cyan rounded-md font-bold border border-accent-cyan/20">{t}</span>)}
                                </div>
                            </div>
                            
                            <div className="flex justify-between items-center pt-2">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl font-extrabold text-accent-cyan drop-shadow-[0_0_15px_rgba(0,210,255,0.3)]">{dummyCase.bigStat}</span>
                                    <span className="text-[10px] font-bold text-gray-400 max-w-[80px] uppercase leading-tight">{dummyCase.bigStatLabel}</span>
                                </div>
                                <div className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-accent-cyan/10 to-accent-purple/10 border border-accent-purple/30 text-white text-[11px] font-bold">
                                    ⏱️ {dummyCase.timeToRoi}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState(1);

            return (
                <div className="min-h-screen p-10 flex flex-col items-center">
                    <h1 className="text-3xl font-bold text-white mb-8 text-transparent bg-clip-text bg-gradient-to-r from-accent-cyan to-accent-purple">Case Study UI Prototypes</h1>
                    
                    <div className="flex gap-4 mb-12 bg-white/5 p-1 rounded-full border border-white/10">
                        {[1, 2, 3].map(num => (
                            <button 
                                key={num}
                                onClick={() => setActiveTab(num)}
                                className={`px-6 py-2 rounded-full text-sm font-bold transition ${activeTab === num ? 'bg-gradient-to-r from-accent-cyan/30 to-accent-purple/30 border border-accent-cyan/50 text-white' : 'text-gray-400 hover:text-white'}`}
                            >
                                Design {num}
                            </button>
                        ))}
                    </div>

                    <div className="w-full">
                        {activeTab === 1 && <ModalPrototype />}
                        {activeTab === 2 && <HoverPrototype />}
                        {activeTab === 3 && <StackedPrototype />}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
